; Test-runner config. Bootstrapped by AIRE at the Story 1.1 baseline checkpoint
; because the repository had no test configuration - it had no tests at all.
;
; pythonpath is the load-bearing setting: the backend is a single module run as
; `uvicorn main:app`, so tests import `main` by bare name. Without this, every
; test fails on import rather than on behaviour.
[pytest]
testpaths = tests
pythonpath = src/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra

; Acceptance-criteria tags from story-1.1.feature. Registered so pytest-bdd's tag-to-marker
; mapping does not emit an unknown-marker warning for each one - the tags are the AC trace, so
; they are meaningful metadata rather than typos.
markers =
    AC-1: acceptance criterion AC-1 from stories.md
    AC-2: acceptance criterion AC-2 from stories.md
    AC-3: acceptance criterion AC-3 from stories.md
