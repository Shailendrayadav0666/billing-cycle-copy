; D2 type-check config. Bootstrapped by AIRE at the Story 1.1 baseline checkpoint
; because the repository had no type-checker config.
;
; RECOMMENDED settings, not --strict. FastAPI and Pydantic ship no stubs for some
; internals, so missing imports are ignored; nothing about the project's own code
; is suppressed.
[mypy]
python_version = 3.13
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
exclude = (venv|node_modules|__pycache__)

; The backend is a single module run as `uvicorn main:app`, so it is imported by
; bare name rather than as a package.
mypy_path = src/backend
