# SonarQube configuration for Billing-Cycle
# Generated by AIRE v1.0 at the EPIC-1 STOP CHECKPOINT.
#
# SonarQube is ADDITIVE to semgrep and the 16-rule Security Baseline review, never a
# replacement for them. If you never configure a Sonar server, the pipeline is still
# fully gated.
#
# sonar.organization below is a PLACEHOLDER you must set yourself - see the setup
# instructions AIRE printed at the STOP CHECKPOINT.
#   - SonarQube Cloud: replace YOUR_ORG_NAME with your organization key.
#   - Self-hosted SonarQube: delete the sonar.organization line entirely.
#
# SONAR_TOKEN and SONAR_HOST_URL are GitHub Actions secrets. Never put a token in this file.

sonar.projectKey=billing-cycle
sonar.projectName=Billing-Cycle
sonar.projectVersion=1.0.0
sonar.organization=YOUR_ORG_NAME

# Sources: both application roots. Everything else in the repo is documentation or tooling.
sonar.sources=src/backend,src/frontend/src
sonar.tests=tests

sonar.sourceEncoding=UTF-8

# Language bindings
sonar.python.version=3.13
sonar.javascript.file.suffixes=.js,.jsx

# Coverage and test reports, produced by .evals/scripts/run-evals.sh
sonar.python.coverage.reportPaths=.evals/evidence/coverage.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info

# Exclusions: vendored trees, build output, framework rule files and generated docs.
# These are not this project's source and would distort every Sonar metric.
sonar.exclusions=\
  **/node_modules/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/dist/**,\
  .aire-rule-details/**,\
  .spec/**,\
  .evals/evidence/**,\
  **/*.min.js

sonar.coverage.exclusions=\
  tests/**,\
  .evals/**,\
  src/frontend/vite.config.js

sonar.cpd.exclusions=\
  tests/**
