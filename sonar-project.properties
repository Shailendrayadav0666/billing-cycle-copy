# SonarQube configuration — generated by AIRE. Only ${SLOT} values vary (Section 4.1.1).
# sonar.organization is left as YOUR_ORG_NAME for the user to set; AIRE cannot know the org key.
# Self-hosted SonarQube does not use organizations — delete that line instead.
# No token belongs in this file. SONAR_TOKEN / SONAR_HOST_URL are GitHub Actions secrets only.

sonar.projectKey=shailendrayadav0666_billing-cycle-copy
sonar.projectName=billing-cycle-copy
sonar.organization=shailendrayadav0666

# sonar.sources / sonar.tests below are REWRITTEN AT RUN TIME by the pipeline's
# "Resolve Sonar scope" step, down to the paths that actually exist in the checkout.
# A path here that does not exist yet would otherwise fail the scan outright.
sonar.sources=src/backend,src/frontend/src
sonar.tests=tests/unit,tests/behavior
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**

# Coverage report path for the detected test runner:
sonar.python.coverage.reportPaths=src/backend/coverage.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
