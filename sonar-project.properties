# SonarQube configuration — generated by AIRE. Only slot values vary (Section 4.1.1).
# sonar.organization is left as YOUR_ORG_NAME for the user to set; AIRE cannot know the org key.
# Self-hosted SonarQube does not use organizations — delete that line if using SonarQube Community.
# No token belongs in this file. SONAR_TOKEN / SONAR_HOST_URL are GitHub Actions secrets only.

sonar.projectKey=Shailendrayadav0666_billing-cycle-copy
sonar.projectName=Billing-Cycle
sonar.organization=Shailendrayadav0666

sonar.sources=src/backend,src/frontend/src
sonar.tests=tests/unit
sonar.test.inclusions=src/frontend/src/**/*.test.js,src/frontend/src/**/*.test.jsx,tests/unit/**

sonar.exclusions=src/frontend/node_modules/**,src/frontend/dist/**,tests/.evals/**,aire-workflow/**,spec/**,reports/**,runtime-artifacts/**

# Coverage report paths for the detected test runners (backend: cobertura, frontend: lcov)
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
